plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = project.mod_version
group = 'dev.prag.newworldspawn'

base {
    archivesName = 'new_world_spawn'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        newworldspawn {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}
